<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Web Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #1e293b;
      --card: #1e293b;
      --card-2: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-2: #2563eb;
      --ok: #10b981;
      --warning: #f59e0b;
      --critical: #ef4444;
      --info: #06b6d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    header.topbar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-inner {
      max-width: 1200px; margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 18px; color: var(--text);
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    nav.main-nav { display: flex; gap: 4px; }
    nav.main-nav a {
      padding: 8px 14px; border-radius: 8px; color: var(--muted);
      font-size: 14px; font-weight: 500; transition: all 0.2s;
    }
    nav.main-nav a:hover { background: var(--card-2); color: var(--text); text-decoration: none; }
    nav.main-nav a.active { background: var(--primary); color: white; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; margin-bottom: 16px;
    }
    .card-title {
      font-size: 18px; font-weight: 700; margin: 0 0 16px;
      display: flex; align-items: center; gap: 8px;
    }
    h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
    h2 { font-size: 22px; font-weight: 700; margin: 0 0 16px; }
    h3 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 8px; font-weight: 600;
      border: none; cursor: pointer; font-size: 14px;
      transition: all 0.15s; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--critical); color: white; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    input[type=text], input[type=url], input[type=search], select {
      width: 100%; padding: 12px 16px; border-radius: 8px;
      background: var(--bg-2); border: 1px solid var(--border);
      color: var(--text); font-size: 15px; font-family: inherit;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: var(--primary); }

    .score-pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 48px; padding: 4px 10px; border-radius: 999px;
      font-weight: 700; font-size: 13px;
    }
    .score-good { background: rgba(16, 185, 129, 0.15); color: var(--ok); }
    .score-mid { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .score-bad { background: rgba(239, 68, 68, 0.15); color: var(--critical); }
    .score-na { background: var(--card-2); color: var(--muted); }

    .severity-critical { color: var(--critical); }
    .severity-warning { color: var(--warning); }
    .severity-ok { color: var(--ok); }
    .severity-info { color: var(--info); }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 800px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }

    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px; font-size: 12px; text-transform: uppercase;
         color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; }
    td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .issue-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .issue-row:last-child { border: 0; }
    .issue-icon {
      width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .issue-icon.critical { background: rgba(239, 68, 68, 0.15); color: var(--critical); }
    .issue-icon.warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .issue-icon.ok { background: rgba(16, 185, 129, 0.15); color: var(--ok); }
    .issue-icon.info { background: rgba(6, 182, 212, 0.15); color: var(--info); }

    .progress-bar {
      height: 8px; background: var(--bg-2); border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), #8b5cf6);
      transition: width 0.3s ease;
    }

    .checkbox-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      background: var(--bg-2); border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); font-size: 14px;
      transition: all 0.15s;
    }
    .checkbox-label:hover { border-color: var(--primary); }
    .checkbox-label input { margin: 0; accent-color: var(--primary); }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      background: var(--card-2); color: var(--muted);
    }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-8 { gap: 8px; }
    .gap-16 { gap: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .mt-16 { margin-top: 16px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="{{ url_for('index') }}" class="logo">
        <span class="logo-mark">W</span>
        <span>Web Analyzer</span>
      </a>
      <nav class="main-nav">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint=='index' %}active{% endif %}">Analyser</a>
        <a href="{{ url_for('history') }}" class="{% if request.endpoint=='history' %}active{% endif %}">Historique</a>
        <a href="{{ url_for('compare_page') }}" class="{% if request.endpoint=='compare_page' %}active{% endif %}">Comparer</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
